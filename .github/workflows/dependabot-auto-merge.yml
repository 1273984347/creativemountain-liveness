name: Dependabot auto-merge (patch / minor)

# 让 Dependabot 的 **patch / minor** 更新在 CI 全绿后自动合并；**major 保持人工审**。
#
# ⚠️ 为什么不用仓库设置里的 "Allow auto-merge"：那个开关只对人类/其他 bot 开的 PR 生效，
#   **Dependabot 自己开的 PR 不会自动合并**（GitHub 的既定行为，防止 bot 互相合并）。
#   所以要由本工作流主动把 PR 放进 GitHub 的自动合并队列。
#
# ⚠️ B95 修掉的两个真缺陷（都是 PR #9 挂起 26 小时逼出来的）：
#   D1「等 CI 全绿」曾经**从未生效**：判据查的是 check-runs，而 CI workflow 的 check-run
#     还没创建时 pending=0 ⇒ 直接判绿。实测 run 45667433870 日志：17:41:45 就打印「CI 全绿」，
#     而 gate chain 17:46:43 才完成 ⇒ **CI 红了也会照发合并指令**。
#     现在改成看 **workflow run**（按 head_sha 查 actions/runs），且**排除本工作流自己**：
#     该 head 上**一条 CI 运行都还没有 ⇒ 判 wait（继续等）**，不是判绿。
#   D2 合并指令以前是发 `@dependabot merge` 评论，发评论的是 GITHUB_TOKEN
#     （github-actions[bot]）—— 它**没有仓库写权限** ⇒ Dependabot 侧不受理：
#     实测 PR #9 收到评论后挂起 26 小时，`auto_merge` 字段始终为 null，从未进队列。
#     现在改用 GitHub 官方文档给出的做法：`gh pr merge --auto` + `permissions: contents: write`。
#     auto-merge 由 GitHub **服务端**执行 ⇒ 合并后照常触发 CI（用 GITHUB_TOKEN 直接 merge 不会触发 CI）。
#
# ⚠️ 为什么用 `pull_request_target`：普通 `pull_request` 事件的 GITHUB_TOKEN 对外部分支只读。
#   本工作流**不 checkout 仓库代码、不使用任何 secret**，且**只处理 dependabot[bot] 开的 PR**
#   （自动触发与手动触发都校验 PR 作者）⇒ 公开仓库上不构成 fork 提权风险。
#
# ⚠️ 第三方 Action 一个都不用（只用 runner 自带的 gh CLI）⇒ 没有 Action 标签被劫持面。

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '手动触发时处理的 PR 号（留空则用触发事件的 PR）'
        required: false
        type: string

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: enable auto-merge once CI is green
    # ⚠️ 自动触发时只处理 Dependabot 自己的 PR ⇒ 人工 PR 永远不会被本工作流碰；
    #    手动触发（workflow_dispatch）时由操作者指定 PR，且**仍会校验 PR 作者**。
    if: github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: classify, wait for green CI, then enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "没有 PR 号可处理 ⇒ 退出"
            exit 0
          fi

          # ⓪ 只碰本仓 Dependabot 自己的 PR（**手动触发也校验**）。
          #    本工作流带 contents: write，若被指到别人的 fork PR 就等于给 fork 提权 ⇒ 必须校验。
          #    ⚠️ D4'（B95 dispatch 实测踩到）：作者标识有**两种形式** —— 平台事件里的 actor 是
          #    `dependabot[bot]`，但 `gh pr view --json author` 读出来的是 **`app/dependabot`**
          #    ⇒ 等值比较会**假阴性**，把 Dependabot 自己的 PR 全挡在门外
          #    （实测 run 45828664828 秒级 exit 0、PR #9 未合并、auto_merge 仍为 null）。
          #    ⇒ 作者判据必须**两种形式都放行**；防 fork 则靠 **head 仓库同源**
          #    （bot 命名会变，仓库归属不会）⇒ 判据抽成可执行块，由守卫直接测。
          REPO_OWNER=$(gh repo view "$REPO" --json owner --jq .owner.login)
          HEAD_OWNER=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRepositoryOwner --jq .headRepositoryOwner.login)
          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq .author.login)
          # >>> DEP-AUTHOR-OK-BEGIN
          # 作者/仓库判据（守卫测试会抽出下面这段 JS **直接执行**，见
          # tests/gates/dependabot-merge-path.test.ts ⇒ 测的就是本文件里这段，不是复刻）：
          #   a. head 仓库 ≠ 本仓 owner      ⇒ no（fork ⇒ 拒绝）
          #   b. 作者 ∈ {dependabot[bot], app/dependabot} ⇒ yes
          #   c. 其余作者                     ⇒ no
          ALLOW=$(node -e '
            const author = process.argv[1];
            const headOwner = process.argv[2];
            const repoOwner = process.argv[3];
            const botNames = ["dependabot[bot]", "app/dependabot"];
            if (headOwner !== repoOwner) { console.log("no"); }
            else if (botNames.includes(author)) { console.log("yes"); }
            else { console.log("no"); }
          ' "$AUTHOR" "$HEAD_OWNER" "$REPO_OWNER")
          # <<< DEP-AUTHOR-OK-END
          if [ "$ALLOW" != "yes" ]; then
            echo "不是本仓 Dependabot 的 PR（作者=$AUTHOR head 仓库=$HEAD_OWNER 本仓=$REPO_OWNER）⇒ 不处理"
            exit 0
          fi
          DRAFT=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isDraft --jq .isDraft)
          if [ "$DRAFT" = "true" ]; then
            echo "PR 是草稿 ⇒ 不处理"
            exit 0
          fi

          # ① 版本语义分类：major ⇒ 保持人工审。
          #    ⚠️ 标题通过 gh 现取（不内插进脚本），避免 PR 标题里的 shell 元字符。
          TITLE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq .title)
          # >>> DEP-CLASSIFY-BEGIN
          # 分类规则（守卫测试会抽出下面这段 JS **直接执行**，见
          # tests/gates/dep-update-classify.test.ts ⇒ 测的就是本文件里这段，不是复刻）：
          #   a. 标题含 deps-major                 ⇒ major（人工审）
          #   b. 能解析 "from A to B" 且主版本号不同 ⇒ major（人工审）
          #   c. 解析不出 from/to（**分组 PR**）   ⇒ unknown ⇒ 保守人工审
          #   d. 能解析且主版本号相同               ⇒ safe（可自动合并）
          CLASS=$(node -e '
            const title = process.argv[1];
            if (title.includes("deps-major")) { console.log("major"); }
            else {
              const m = title.match(/from\s+v?(\d+)(?:\.\d+)*\s+to\s+v?(\d+)(?:\.\d+)*/);
              if (!m) { console.log("unknown"); }
              else { console.log(m[1] === m[2] ? "safe" : "major"); }
            }
          ' "$TITLE")
          # <<< DEP-CLASSIFY-END
          case "$CLASS" in
            major)
              echo "major 版本变更 ⇒ 保持人工审：$TITLE"
              exit 0
              ;;
            unknown)
              echo "无法判定版本跨度（分组 PR？）⇒ 保守保持人工审：$TITLE"
              exit 0
              ;;
          esac

          # ② 预发布依赖闸：diff 里若**新增**带 -beta / -alpha / -rc 的版本号 ⇒ 保持人工审。
          #    起因（B87 观察）：Dependabot 把「patch 组」命名得很乐观，但组里混进的**传递依赖**
          #    可能是 beta（如 @emnapi/core 2.0.0-beta.2）⇒ 只看分组名会漏。
          #    ⚠️ 只看**新增行**（以 + 开头）⇒ lock 里原本就有的 beta 不受影响。
          PRE_RELEASE_RE='^\+.*"version": "[^"]*-(beta|alpha|rc|pre|next)[.0-9]*"'
          if gh pr diff "$PR_NUMBER" --repo "$REPO" | grep -E "$PRE_RELEASE_RE" >/dev/null; then
            echo "PR 新增了预发布版本依赖（beta/alpha/rc）⇒ 保持人工审"
            # ⚠️ 用 grep -m 5 而不是「| head -5」：管道被 head 提前关闭会让 grep 收到 SIGPIPE，
            #    set -o pipefail 下整条管道返回非 0 ⇒ 脚本在这里退出（workflow 变红），
            #    还会跳过后面本该跑的「保持人工审」分支。
            gh pr diff "$PR_NUMBER" --repo "$REPO" | grep -E -m 5 "$PRE_RELEASE_RE"
            exit 0
          fi

          SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
          echo "PR #$PR_NUMBER  head=$SHA  标题=$TITLE"

          # ③ 等 CI：查**该 head sha 上的 workflow run**（不是 check-run），最多 20 次 × 45s。
          #    ⚠️ 排除本工作流自己（它的 run 永远在跑 ⇒ 否则永远判 wait）。
          #    ⚠️ CI workflow 还没起 ⇒ 判 wait（**这是 D1 的修复点**：原来这里会误判成绿）。
          green=0
          for i in $(seq 1 20); do
            RUNS_JSON=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" --jq '[.workflow_runs[] | select(.path != ".github/workflows/dependabot-auto-merge.yml") | {name: .name, status: .status, conclusion: .conclusion, head_sha: .head_sha}]')
            # >>> DEP-CI-GREEN-BEGIN
            # CI 判据（守卫测试会抽出下面这段 JS **直接执行**，见
            # tests/gates/dependabot-merge-path.test.ts ⇒ 测的就是本文件里这段，不是复刻）：
            #   a. 该 head 上没有任何 run              ⇒ wait（CI 还没启动 ⇒ **不能判绿**）
            #   b. 有 run 但没全部 completed            ⇒ wait
            #   c. 有 run 的 conclusion 不是 success     ⇒ fail（⇒ 不合并）
            #   d. 全部 success 且其中至少一条属于 CI 工作流 ⇒ green
            VERDICT=$(node -e '
              const sha = process.argv[1];
              const runs = JSON.parse(process.argv[2] || "[]");
              const mine = runs.filter(r => r.head_sha === sha);
              if (mine.length === 0) { console.log("wait"); }
              else if (mine.some(r => r.status !== "completed")) { console.log("wait"); }
              else if (mine.some(r => r.conclusion !== "success")) { console.log("fail"); }
              else if (!mine.some(r => r.name === "CI")) { console.log("wait"); }
              else { console.log("green"); }
            ' "$SHA" "$RUNS_JSON")
            # <<< DEP-CI-GREEN-END
            case "$VERDICT" in
              green)
                green=1
                echo "CI 全绿（第 $i 次判定）"
                break
                ;;
              fail)
                echo "CI 存在失败项 ⇒ 不合并"
                exit 0
                ;;
              wait)
                echo "等待 CI：该 head 上还没有 CI 运行 / 未全部完成（第 $i 次）"
                sleep 45
                ;;
            esac
          done

          if [ "$green" -ne 1 ]; then
            echo "未确认 CI 全绿 ⇒ 本次不合并（下次 synchronize 会重试）"
            exit 0
          fi

          # ④ 幂等：已经进过自动合并队列就不重复。
          AUTO=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$AUTO" = "true" ]; then
            echo "auto-merge 已启用 ⇒ 跳过"
            exit 0
          fi

          # ⑤ 把 PR 放进 GitHub 的自动合并队列（由服务端执行 ⇒ 合并会触发 CI）。
          PR_URL=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json url --jq .url)
          gh pr merge --auto --squash "$PR_URL"
          echo "已为 PR #$PR_NUMBER 启用 auto-merge（squash）"
