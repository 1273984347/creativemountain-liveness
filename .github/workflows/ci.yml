name: CI

# The gate chain is this project's contract: any failure must fail the build.
#
# ⚠️ The **authoritative** verified combination is Windows (windows-latest) × Node 22 × Chromium.
#   Linux / macOS are **not verified** — see README「验证状态与非目标」.
#
# ⚠️ Every third-party Action is pinned to a full 40-char commit SHA (a mutable tag like
#   `@v4` could be repointed). The comment after each SHA is the human-readable version.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: deny everything at the top level, then grant per job.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-chain:
    name: gate chain (15 gates) — windows / node 24 / chromium
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: install dependencies (lockfile-exact, npm ci)
        run: npm ci

      - name: install chromium (for gates 10 & 14 — browser e2e and UI walkthrough)
        run: npx playwright install chromium

      - name: gate chain — types / tests / doc-drift / build / theme+IR / parity / balance / browser
        run: npm run gate

      - name: upload single-file build (artifact for manual smoke test)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digital-track-html
          path: dist/*.html
          if-no-files-found: ignore
          retention-days: 7
