  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;

      --font-mono: 'Geist Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem;

    .frame { max-width: 1520px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.2vw + 0.75rem, 2.6rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.6rem;
    }
    .tagline {
      font-size: 0.95rem;
      color: var(--color-muted);
      max-width: 62ch;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    footer {
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(45,49,66,0.12);

      font-size: 0.66rem;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    <h1>回合流程</h1>
    <p class="tagline">一次回合在引擎里怎么跑：玩家出牌 → 引擎结算 → 骰子与 20 面指令表 → 对峙分支（橘红）→ 回合解锁。</p>

      <desc id="turn-flow-slide-16x9-desc">时序图：玩家在界面上选行棋 / 问天 / 出牌，界面把动作交给引擎 performAction；引擎掷 6 面移动骰或 20 面指令骰，并向 20 面指令表取该面的指令文案，结算地形、裁牌与收入后推进手番；若落点与其他存活玩家同格则进入对峙，回合阻塞，界面提交锁定亮牌后才同时揭晓，败者后退 1 格并抽 1 张，揭晓后回合解锁。</desc>

      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>
