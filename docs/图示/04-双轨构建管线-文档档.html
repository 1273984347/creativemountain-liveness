  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;

      --font-mono: 'Geist Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.2vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.6rem;
    }
    .tagline {
      font-size: 0.95rem;
      color: var(--color-muted);
      max-width: 62ch;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    footer {
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(45,49,66,0.12);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    <h1>双轨构建管线</h1>
    <p class="tagline">一套主题包分出两条轨：数字轨是单文件离线 HTML，实体轨是规则书与实体件 PDF；门禁⑦把 IR 与 SVG 逐字比对，锁住两轨不许各说各话。</p>
